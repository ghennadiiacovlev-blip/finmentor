name: FINMENTOR Quality Gates

# The canonical repository CI. The three Mini App workflows beside this one are
# path-scoped to their own phase; none of them covers the behavioural gates that guard the
# remediated production behaviour, so before this workflow existed a merge to main had no
# mandatory status check over them at all.
#
# Everything here is offline: no secrets, no network, no n8n, no Google, no browser.
#
# WHAT A GREEN RUN HERE DOES AND DOES NOT MEAN.
#
# It means the CANONICAL CHECKS pass, and those are now the same set a full local
# verification runs: JavaScript syntax over every tracked source, PowerShell parse over
# every script, the behavioural gates through the same entry point used locally
# (`node qa/run-all.mjs`), the assertion baseline, cwd-independence, and the secret scan
# together with its self-test. For that set, a green CI and a green laptop mean the same
# thing — which is the point of running the gates through the identical entry point rather
# than a CI-only variant.
#
# It does NOT mean every check in the programme has run. The security MUTATION harness —
# deliberately breaking a control to prove the gate notices — is a SEPARATE, MANUAL
# regression. It temporarily edits tracked sources and restores them, which is not
# something an automatic status check should do, so it is not run here and no claim about
# it should be read into a green tick. It is executed and recorded per night-shift phase;
# see `docs/FINMENTOR_NIGHT_SHIFT_FINAL_REGRESSION_2026-08-26.md` §3 for the most recent
# run and the controls it covers.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  # Raise this deliberately when gates are added. It must never be lowered to make a red
  # build green: a falling count means coverage was removed, which is the thing worth
  # catching.
  ASSERTION_BASELINE: '529'

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Runtime
        run: |
          node --version
          echo "no package.json and no dependencies by design; the gates are plain Node"

      - name: Syntax check every tracked JavaScript source
        shell: bash
        run: |
          set -euo pipefail
          # Driven by `git ls-files` rather than a hand-maintained glob list, so a new source
          # is covered the moment it is tracked. This also widens coverage to the root and
          # app/ browser scripts, which the previous glob list omitted entirely — and it
          # removes a latent trap: `n8n/src/**/*.js` only matched because bash without
          # globstar expands `**` like `*`, which happens to fit the current two-level
          # layout and would silently stop matching if that layout changed.
          fail=0
          count=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -e "$f" ] || continue
            count=$((count+1))
            if ! node --check "$f" >/dev/null 2>&1; then
              echo "SYNTAX FAIL: $f"
              node --check "$f" || true
              fail=1
            fi
          done < <(git ls-files '*.js' '*.mjs')
          [ "$fail" -eq 0 ] || exit 1
          echo "syntax: $count tracked JavaScript sources parse"

      - name: PowerShell parse check
        shell: pwsh
        run: |
          # The scripts/ PowerShell helpers are the live-operations surface. They are never
          # executed here — no tenant, no credentials, no network — but a script that does
          # not parse is a defect that would only surface at the moment someone needs it.
          # ParseFile is static analysis: it reads the file and builds an AST, it does not
          # run anything.
          $files = Get-ChildItem -Path scripts -Filter *.ps1 -File
          $bad = @()
          foreach ($f in $files) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) > $null
            if ($errs -and $errs.Count -gt 0) {
              Write-Output ("PARSE FAIL: " + $f.Name)
              $errs | ForEach-Object { Write-Output ("  " + $_.Message) }
              $bad += $f.Name
            }
          }
          if ($bad.Count -gt 0) { exit 1 }
          Write-Output ("powershell: " + $files.Count + " scripts parse")

      - name: Canonical quality gates
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          node qa/run-all.mjs | tee gates.out
          echo "---"
          grep -E '^[0-9]+/[0-9]+ gates passed' gates.out
          grep -E '^TOTAL ASSERTIONS:' gates.out

      - name: Assertion baseline
        shell: bash
        run: |
          set -euo pipefail
          total="$(grep -oE '^TOTAL ASSERTIONS: [0-9]+' gates.out | grep -oE '[0-9]+')"
          echo "total=$total baseline=${ASSERTION_BASELINE}"
          if [ "$total" -lt "${ASSERTION_BASELINE}" ]; then
            echo "FAIL: assertion count fell from ${ASSERTION_BASELINE} to $total — coverage was removed"
            exit 1
          fi
          if [ "$total" -gt "${ASSERTION_BASELINE}" ]; then
            echo "NOTE: assertions grew to $total; raise ASSERTION_BASELINE in this workflow"
          fi
          echo "assertion baseline: PASS"

      - name: Gates are cwd-independent
        shell: bash
        run: |
          set -euo pipefail
          repo="$PWD"
          cd /
          node "$repo/qa/run-all.mjs" > /tmp/cwd.out
          grep -qE '^9/9 gates passed' /tmp/cwd.out
          echo "cwd independence: PASS"

      - name: Secret scan self-test
        shell: bash
        run: |
          # Proves the MATCHER before trusting its verdict on the repository. The case that
          # matters: an allowlisted test fixture and a genuine credential-shaped token on
          # the same line must still be detected. An earlier line-level allowlist skipped
          # the whole line and would have missed it.
          node scripts/secret-scan.mjs --self-test

      - name: Secret scan over tracked files
        shell: bash
        run: node scripts/secret-scan.mjs

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### FINMENTOR quality gates'
            echo
            if [ -f gates.out ]; then
              sed -n '1,/gates passed/p' gates.out | sed 's/^/    /'
              grep -E '^TOTAL ASSERTIONS:' gates.out || true
            else
              echo 'gates did not run'
            fi
            echo
            echo 'Ran: JS syntax (all tracked sources), PowerShell parse, behavioural gates,'
            echo 'assertion baseline, cwd-independence, secret scan + self-test.'
            echo 'NOT run here: the security mutation harness (separate, manual regression).'
            echo 'Offline: no secrets, no network, no n8n, no Google, no browser.'
            echo 'This workflow changes nothing in production.'
          } >> "$GITHUB_STEP_SUMMARY"
