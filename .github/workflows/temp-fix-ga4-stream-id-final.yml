name: Temporary final GA4 stream ID fix

on:
  push:
    branches:
      - fix/ga4-stream-id-final

permissions:
  contents: write

jobs:
  fix-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ga4-stream-id-final
          fetch-depth: 0

      - name: Apply exact Measurement ID correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'G-94L98WZ12' analytics.js | wc -l)" -eq 1
          ! grep -q 'G-94L9B8WZ12' analytics.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('analytics.js')
          text = p.read_text(encoding='utf-8')
          old = "var GA4_ID = window.FM_GA4_ID || 'G-94L98WZ12';"
          new = "var GA4_ID = window.FM_GA4_ID || 'G-94L9B8WZ12';"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one old GA4 ID assignment')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: QA exact diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check analytics.js
          test "$(grep -o 'G-94L9B8WZ12' analytics.js | wc -l)" -eq 1
          ! grep -q 'G-94L98WZ12' analytics.js
          test "$(git diff --name-only)" = "analytics.js"
          test "$(git diff --numstat analytics.js)" = $'1\t1\tanalytics.js'

      - name: Commit feature and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-fix-ga4-stream-id-final.yml
          git add analytics.js .github/workflows/temp-fix-ga4-stream-id-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use verified GA4 web stream ID"
          git push origin HEAD:fix/ga4-stream-id-final
