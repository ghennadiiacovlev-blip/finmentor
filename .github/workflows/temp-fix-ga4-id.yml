name: Temporary GA4 measurement ID hotfix

on:
  push:
    branches:
      - fix/ga4-measurement-id-regression

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ga4-measurement-id-regression
          fetch-depth: 0

      - name: Replace only regressed measurement ID
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o "G-94L9B8WZ12" analytics.js | wc -l)" -eq 1
          test "$(grep -o "G-94L98WZ12" analytics.js | wc -l)" -eq 0
          sed -i "s/G-94L9B8WZ12/G-94L98WZ12/" analytics.js
          test "$(grep -o "G-94L98WZ12" analytics.js | wc -l)" -eq 1
          ! grep -q "G-94L9B8WZ12" analytics.js
          git diff --check

      - name: Remove temporary workflow and commit exact hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-fix-ga4-id.yml
          git add analytics.js .github/workflows/temp-fix-ga4-id.yml
          changed="$(git diff --cached --name-only)"
          test "$changed" = $'.github/workflows/temp-fix-ga4-id.yml\nanalytics.js'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: restore GA4 measurement ID from release"
          git push origin HEAD:fix/ga4-measurement-id-regression
