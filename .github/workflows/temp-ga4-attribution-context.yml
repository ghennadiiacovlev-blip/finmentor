name: Temporary GA4 attribution context builder

on:
  push:
    branches:
      - feat/ga4-offline-attribution-context

permissions:
  contents: write

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ga4-offline-attribution-context
          fetch-depth: 0

      - name: Apply consent-gated attribution enrichment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          analytics_marker = "  function initConsentUi() {\n"
          analytics_insert = r'''  function getAttributionContext(timeoutMs) {
    return new Promise(function (resolve) {
      var out = { analytics_consent: getChoice() === 'accept' };
      if (!out.analytics_consent || !configured || typeof window.gtag !== 'function' || window.gtag === noopGtag) {
        resolve(out);
        return;
      }

      var finished = false;
      var pending = 2;
      var waitMs = (typeof timeoutMs === 'number' && timeoutMs >= 0) ? timeoutMs : 1800;
      var timer = window.setTimeout(finish, waitMs);

      function finish() {
        if (finished) return;
        finished = true;
        window.clearTimeout(timer);
        resolve(out);
      }

      function capture(key, value) {
        if (finished) return;
        var clean = String(value === undefined || value === null ? '' : value).trim().slice(0, 120);
        if (clean) out[key] = clean;
        pending -= 1;
        if (pending <= 0) finish();
      }

      try {
        window.gtag('get', GA4_ID, 'client_id', function (value) { capture('ga_client_id', value); });
        window.gtag('get', GA4_ID, 'session_id', function (value) { capture('ga_session_id', value); });
      } catch (e) {
        finish();
      }
    });
  }

  function enrichLeadPayload(payload, timeoutMs) {
    payload = (payload && typeof payload === 'object') ? payload : {};
    payload.meta = (payload.meta && typeof payload.meta === 'object') ? payload.meta : {};

    return getAttributionContext(timeoutMs).then(function (context) {
      payload.meta.analytics_consent = !!context.analytics_consent;
      delete payload.meta.ga_client_id;
      delete payload.meta.ga_session_id;
      if (context.ga_client_id) payload.meta.ga_client_id = context.ga_client_id;
      if (context.ga_session_id) payload.meta.ga_session_id = context.ga_session_id;
      return payload;
    }, function () {
      payload.meta.analytics_consent = getChoice() === 'accept';
      delete payload.meta.ga_client_id;
      delete payload.meta.ga_session_id;
      return payload;
    });
  }

'''
          replace_once('analytics.js', analytics_marker, analytics_insert + analytics_marker)

          analytics_export_old = "    getConsent: getChoice,\n    isLoaded: function () { return loaded; }\n"
          analytics_export_new = "    getConsent: getChoice,\n    getAttributionContext: getAttributionContext,\n    enrichLeadPayload: enrichLeadPayload,\n    isLoaded: function () { return loaded; }\n"
          replace_once('analytics.js', analytics_export_old, analytics_export_new)

          main_old = '''      if (submit) submit.disabled = true;
      postLeadPayload(payload).then(function () {
        thankYou('contact');
      }).catch(function () {
'''
          main_new = '''      if (submit) submit.disabled = true;
      var enrichPromise = Promise.resolve(payload);
      if (window.FMAnalytics && typeof window.FMAnalytics.enrichLeadPayload === 'function') {
        try { enrichPromise = window.FMAnalytics.enrichLeadPayload(payload, 1800); } catch (e) {}
      } else {
        payload.meta.analytics_consent = false;
      }
      enrichPromise.catch(function () { return payload; }).then(function (enrichedPayload) {
        payload = enrichedPayload || payload;
        return postLeadPayload(payload);
      }).then(function () {
        thankYou('contact');
      }).catch(function () {
'''
          replace_once('main.js', main_old, main_new)

          q_old = '''    setSubmitting(true);
    postQuestionnairePayload(payload)
      .then(function () {
'''
          q_new = '''    setSubmitting(true);
    var enrichPromise = Promise.resolve(payload);
    if (window.FMAnalytics && typeof window.FMAnalytics.enrichLeadPayload === 'function') {
      try { enrichPromise = window.FMAnalytics.enrichLeadPayload(payload, 1800); } catch (e) {}
    } else {
      payload.meta = payload.meta || {};
      payload.meta.analytics_consent = false;
    }
    enrichPromise.catch(function () { return payload; }).then(function (enrichedPayload) {
      payload = enrichedPayload || payload;
      return postQuestionnairePayload(payload);
    })
      .then(function () {
'''
          replace_once('questionnaire.html', q_old, q_new)
          replace_once('ro/questionnaire.html', q_old, q_new)
          PY

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -o 'G-94L98WZ12' analytics.js | wc -l)" -eq 1
          ! grep -q 'G-94L9B8WZ12' analytics.js
          test "$(grep -o 'enrichLeadPayload' analytics.js | wc -l)" -ge 2
          grep -q "gtag('get', GA4_ID, 'client_id'" analytics.js
          grep -q "gtag('get', GA4_ID, 'session_id'" analytics.js
          grep -q "analytics_consent" main.js
          grep -q "analytics_consent" questionnaire.html
          grep -q "analytics_consent" ro/questionnaire.html
          node --check analytics.js
          node --check main.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for src, out in [('questionnaire.html','/tmp/q-ru.js'), ('ro/questionnaire.html','/tmp/q-ro.js')]:
              text = Path(src).read_text(encoding='utf-8')
              blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.I|re.S)
              candidates = [b for b in blocks if 'postQuestionnairePayload' in b]
              if len(candidates) != 1:
                  raise SystemExit(f'{src}: expected one questionnaire script, got {len(candidates)}')
              Path(out).write_text(candidates[0], encoding='utf-8')
          PY
          node --check /tmp/q-ru.js
          node --check /tmp/q-ro.js
          changed="$(git diff --name-only | sort)"
          expected=$'analytics.js\nmain.js\nquestionnaire.html\nro/questionnaire.html'
          test "$changed" = "$expected"

      - name: Browser QA for consent-gated IDs
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save puppeteer-core@24.16.0
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 8765 >/tmp/fm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          cat > /tmp/qa-attribution.cjs <<'EOF'
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          (async () => {
            const browser = await puppeteer.launch({executablePath: process.env.CHROME, headless: true, args:['--no-sandbox','--disable-dev-shm-usage']});
            const page = await browser.newPage();
            await page.goto('http://127.0.0.1:8765/?debug_ga4=1', {waitUntil:'domcontentloaded', timeout:30000});
            const denied = await page.evaluate(() => window.FMAnalytics.enrichLeadPayload({meta:{marker:'deny'}}, 100));
            assert(denied.meta.analytics_consent === false, 'Denied consent must be false');
            assert(!('ga_client_id' in denied.meta), 'Denied consent leaked ga_client_id');
            assert(!('ga_session_id' in denied.meta), 'Denied consent leaked ga_session_id');
            console.log('DENIED_CONTEXT_PASS');

            await page.evaluate(() => localStorage.setItem('finmentor_cookie_consent', 'accept'));
            await page.reload({waitUntil:'networkidle2', timeout:60000});
            await new Promise(r => setTimeout(r, 2500));
            const accepted = await page.evaluate(() => window.FMAnalytics.enrichLeadPayload({meta:{marker:'accept'}}, 3500));
            assert(accepted.meta.analytics_consent === true, 'Accepted consent must be true');
            assert(typeof accepted.meta.ga_client_id === 'string' && accepted.meta.ga_client_id.length > 3, 'Accepted context missing ga_client_id');
            console.log('ACCEPTED_CONTEXT', JSON.stringify({analytics_consent:accepted.meta.analytics_consent, client_id_present:!!accepted.meta.ga_client_id, session_id_present:!!accepted.meta.ga_session_id}));
            await browser.close();
          })().catch(e => { console.error(e.stack || e); process.exit(1); });
          EOF
          CHROME="$CHROME" node /tmp/qa-attribution.cjs

      - name: Commit exact feature diff and remove temporary workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-ga4-attribution-context.yml
          git add analytics.js main.js questionnaire.html ro/questionnaire.html .github/workflows/temp-ga4-attribution-context.yml
          changed="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/temp-ga4-attribution-context.yml\nanalytics.js\nmain.js\nquestionnaire.html\nro/questionnaire.html'
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: preserve GA4 attribution context on leads"
          git push origin HEAD:feat/ga4-offline-attribution-context
