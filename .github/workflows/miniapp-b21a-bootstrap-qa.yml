name: Mini App B.2.1-A Bootstrap QA

on:
  pull_request:
    paths:
      - 'gateway/n8n/**'
      - 'docs/PHASE_B2_1A_BOOTSTRAP_CANARY.md'
      - '.github/workflows/miniapp-b21a-bootstrap-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-canary-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check gateway/n8n/bootstrap-canary.js && node --check gateway/n8n/bootstrap-canary.test.js
      - name: Guard and trust-boundary harness
        run: cd gateway/n8n && node bootstrap-canary.test.js
      - name: Secret-surface guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'bot[ _-]?token|api[_ -]?key|bearer[[:space:]]+[A-Za-z0-9._-]+' gateway/n8n; then
            echo 'Potential secret surface detected' >&2
            exit 1
          fi
          if grep -Rni 'initDataUnsafe' gateway/n8n; then
            echo 'Unsafe browser identity surface detected' >&2
            exit 1
          fi
