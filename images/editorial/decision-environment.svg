<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1280" width="1920" height="1280" role="presentation">
  <!--
    FINMENTOR — IMAGE 02 placeholder · decision-environment
    Final asset: premium dark desk, financial documents, restrained materials.
    See IMAGE_ART_DIRECTION.md §3. Replace this file, keep the name.
  -->
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#14202F"/>
      <stop offset="0.5" stop-color="#0E1826"/>
      <stop offset="1" stop-color="#090F1A"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7E3D8"/>
      <stop offset="1" stop-color="#C3BFB4"/>
    </linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D5D1C6"/>
      <stop offset="1" stop-color="#AEAAA0"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.42" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#F0E4C4" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#C9A227" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#08111F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgefade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08111F" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#08111F" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#08111F" stop-opacity="0"/>
      <stop offset="1" stop-color="#08111F" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1280" fill="url(#desk)"/>
  <rect width="1920" height="1280" fill="url(#pool)"/>

  <!-- stone / metal band across the surface -->
  <rect y="946" width="1920" height="6" fill="#26374B" opacity="0.5"/>

  <!-- lower document, rotated -->
  <g transform="rotate(-6.5 720 700)" opacity="0.9">
    <rect x="330" y="404" width="800" height="600" rx="4" fill="url(#paper2)"/>
    <g fill="#5E5A50" opacity="0.5">
      <rect x="392" y="486" width="404" height="9"/>
      <rect x="392" y="530" width="560" height="7"/>
      <rect x="392" y="562" width="560" height="7"/>
      <rect x="392" y="594" width="470" height="7"/>
    </g>
  </g>

  <!-- upper document -->
  <g transform="rotate(2.2 880 660)">
    <rect x="470" y="330" width="820" height="628" rx="4" fill="url(#paper)"/>
    <rect x="470" y="330" width="820" height="10" fill="#B9B4A6" opacity="0.5"/>
    <g fill="#4A473F" opacity="0.62">
      <rect x="538" y="418" width="300" height="12"/>
      <rect x="538" y="480" width="672" height="7"/>
      <rect x="538" y="512" width="672" height="7"/>
      <rect x="538" y="544" width="560" height="7"/>
    </g>
    <!-- restrained ruled rows, not a chart -->
    <g fill="#6E6A5F" opacity="0.32">
      <rect x="538" y="636" width="672" height="3"/>
      <rect x="538" y="700" width="672" height="3"/>
      <rect x="538" y="764" width="672" height="3"/>
      <rect x="538" y="828" width="672" height="3"/>
    </g>
    <rect x="538" y="880" width="214" height="4" fill="#8C6A1A" opacity="0.75"/>
  </g>

  <!-- pen -->
  <g transform="rotate(-24 1420 880)">
    <rect x="1250" y="866" width="340" height="16" rx="8" fill="#1C2A3B"/>
    <rect x="1560" y="868" width="46" height="12" rx="6" fill="#C9A227" opacity="0.85"/>
    <rect x="1300" y="870" width="180" height="3" fill="#3A5170" opacity="0.7"/>
  </g>

  <!-- glass / metal object, right -->
  <rect x="1660" y="600" width="150" height="230" rx="6" fill="#203247" opacity="0.6"/>
  <rect x="1660" y="600" width="150" height="8" rx="4" fill="#3E5B7D" opacity="0.6"/>

  <rect width="1920" height="1280" fill="url(#edgefade)"/>
</svg>
