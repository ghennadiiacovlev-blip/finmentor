      <stop offset="0" stop-color="#52759E"/>
      <stop offset="0.42" stop-color="#31506F"/>
      <stop offset="1" stop-color="#16263A"/>
    </linearGradient>
    <linearGradient id="skyRefl" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#9DBBD8" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#6E93B8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1B2E45" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rake" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.80"/>
      <stop offset="0.45" stop-color="#E8C766" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
