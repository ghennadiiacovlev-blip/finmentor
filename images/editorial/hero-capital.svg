    <radialGradient id="sun" cx="0.62" cy="0.06" r="0.52">
      <stop offset="0" stop-color="#FFF3D2" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFF3D2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nearPier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E1B29"/>
      <stop offset="1" stop-color="#25384F"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1422" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A1422" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#sky)"/>
  <rect width="2560" height="1440" fill="url(#sun)"/>

