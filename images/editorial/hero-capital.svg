    FINMENTOR — IMAGE 01 · hero-capital
    VECTOR ARCHITECTURAL ARTWORK standing in for licensed photography.
    Low-angle perspective, facade receding right: the frame carries SCALE.
    Luminance is deliberately high — the page scrim (style.css .hero__scrim)
    does the darkening, so the artwork must not pre-darken itself.
    Final asset + generation prompt: IMAGE_ART_DIRECTION.md §2.
  -->
  <defs>
