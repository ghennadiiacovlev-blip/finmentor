<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" role="presentation" aria-hidden="true">
  <!--
    FINMENTOR — IMAGE 01 · hero-capital
    EDITORIAL ARCHITECTURAL ARTWORK (vector), not a photograph.
    Final slot: licensed photography of contemporary European business
    architecture. Generation prompt: IMAGE_ART_DIRECTION.md §2.
    Left 45% is tonally flat by construction — the headline sits there.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#22354F"/>
      <stop offset="0.45" stop-color="#152539"/>
      <stop offset="1" stop-color="#0A1422"/>
    </linearGradient>
    <linearGradient id="towerA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B2E45"/>
      <stop offset="0.62" stop-color="#22394F"/>
      <stop offset="1" stop-color="#101E2F"/>
    </linearGradient>
    <linearGradient id="towerB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16273B"/>
      <stop offset="1" stop-color="#0C1828"/>
    </linearGradient>
    <linearGradient id="glazing" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#31557A" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#1C3049" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0D1B2C" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="rake" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#E8C766" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#C9A227" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stoneBase" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2B3B4E"/>
      <stop offset="1" stop-color="#121E2C"/>
    </linearGradient>
    <!-- the flattening ramp that guarantees headline legibility -->
    <linearGradient id="quiet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.30" stop-color="#08111F" stop-opacity="0.96"/>
      <stop offset="0.52" stop-color="#08111F" stop-opacity="0.68"/>
      <stop offset="0.78" stop-color="#08111F" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#08111F" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08111F" stop-opacity="0"/>
      <stop offset="1" stop-color="#08111F" stop-opacity="0.86"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.16" r="0.42">
      <stop offset="0" stop-color="#F0DDA6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F0DDA6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#sky)"/>
  <rect width="2560" height="1440" fill="url(#glow)"/>

  <!-- DISTANT PLANE — soft, low contrast, reads as depth not detail -->
  <g opacity="0.5">
    <rect x="1216" y="392" width="196" height="1048" fill="url(#towerB)"/>
    <rect x="1444" y="470" width="150" height="970" fill="url(#towerB)"/>
    <rect x="2288" y="430" width="180" height="1010" fill="url(#towerB)"/>
  </g>

  <!-- MID PLANE — the principal volume, offset right of centre -->
  <g>
    <rect x="1596" y="196" width="470" height="1244" fill="url(#towerA)"/>
    <!-- glazing bays -->
    <g>
      <rect x="1640" y="246" width="126" height="1194" fill="url(#glazing)"/>
      <rect x="1794" y="246" width="126" height="1194" fill="url(#glazing)"/>
      <rect x="1948" y="246" width="82"  height="1194" fill="url(#glazing)"/>
    </g>
    <!-- mullions: the vertical rhythm that makes it architecture, not a box -->
    <g fill="#3E6189" opacity="0.42">
      <rect x="1682" y="246" width="3" height="1194"/>
      <rect x="1724" y="246" width="3" height="1194"/>
      <rect x="1836" y="246" width="3" height="1194"/>
      <rect x="1878" y="246" width="3" height="1194"/>
      <rect x="1990" y="246" width="3" height="1194"/>
    </g>
    <!-- floor slabs -->
    <g fill="#0B1726" opacity="0.66">
      <rect x="1596" y="386" width="470" height="8"/>
      <rect x="1596" y="562" width="470" height="8"/>
      <rect x="1596" y="738" width="470" height="8"/>
      <rect x="1596" y="914" width="470" height="8"/>
      <rect x="1596" y="1090" width="470" height="8"/>
      <rect x="1596" y="1266" width="470" height="8"/>
    </g>
    <!-- parapet -->
    <rect x="1578" y="182" width="506" height="20" fill="#2C4462"/>
  </g>

  <!-- FOREGROUND STONE PIER — material contrast, anchors the right edge -->
  <g>
    <path d="M2170 300 L2560 246 L2560 1440 L2170 1440 Z" fill="url(#stoneBase)"/>
    <g fill="#0A1523" opacity="0.5">
      <path d="M2170 620 L2560 578 L2560 590 L2170 632 Z"/>
      <path d="M2170 940 L2560 908 L2560 920 L2170 952 Z"/>
      <path d="M2170 1260 L2560 1238 L2560 1250 L2170 1272 Z"/>
    </g>
    <!-- the single warm rake of late-afternoon light on one edge -->
    <path d="M2170 300 L2246 290 L2246 1440 L2170 1440 Z" fill="url(#rake)"/>
    <rect x="2170" y="300" width="4" height="1140" fill="#E8C766" opacity="0.30"/>
  </g>

  <!-- the lit vertical edge of the principal volume -->
  <rect x="2062" y="196" width="5" height="1244" fill="#D8B450" opacity="0.22"/>

  <!-- atmosphere and seating -->
  <rect y="980" width="2560" height="460" fill="url(#ground)"/>
  <rect width="2560" height="1440" fill="url(#quiet)"/>
</svg>
