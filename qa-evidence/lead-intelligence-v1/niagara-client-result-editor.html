Частичный контроль дебиторской задолженности | Указано в анкете | Средства могут дольше оставаться в оборотном капитале.</textarea><small>Один риск на строку: название | основание | последствие</small></label><label class="edit-field"><span>Приоритеты управления</span><textarea name="management_priorities" rows="4" maxlength="4000">Проверить качество прогноза денежных средств.
Разобрать дебиторскую задолженность и календарь CAPEX.
Закрепить правила приоритизации платежей.</textarea><small>Один приоритет на строку</small></label><label class="edit-field"><span>План · дни 1–7</span><textarea name="plan_days_1_7" rows="4" maxlength="4000">Сверить прогноз с фактическим движением денег.</textarea></label><label class="edit-field"><span>План · дни 8–14</span><textarea name="plan_days_8_14" rows="4" maxlength="4000">Провести анализ дебиторской и кредиторской задолженности.</textarea></label><label class="edit-field"><span>План · дни 15–21</span><textarea name="plan_days_15_21" rows="4" maxlength="4000">Разделить операционные и инвестиционные платежи.</textarea></label><label class="edit-field"><span>План · дни 22–30</span><textarea name="plan_days_22_30" rows="4" maxlength="4000">Зафиксировать платёжные правила и контроль отклонений.</textarea></label><label class="edit-field"><span>Действия сейчас</span><textarea name="tomorrow_actions" rows="4" maxlength="4000">Собрать Cash Flow, платёжный календарь и данные по задолженности.</textarea></label><label class="edit-field"><span>Название рекомендации</span><textarea name="recommendation_label" rows="2" maxlength="4000">Financial Health Check</textarea></label><label class="edit-field"><span>Обоснование рекомендации</span><textarea name="recommendation_rationale" rows="4" maxlength="4000">Независимая диагностика позволит подтвердить источник разрывов до выбора формата решения.</textarea></label><div class="form-actions"><button class="btn primary" type="submit">Сохранить</button><a class="btn" href="?a=XA-NIAGARA-UAT&amp;t=uat-not-a-production-token&amp;view=preview">Предпросмотр клиента</a></div></form></div></main></article><nav class="actionsbar"><a class="btn ghost" href="?a=XA-NIAGARA-UAT&amp;t=uat-not-a-production-token">Разбор</a><a class="btn" href="?a=XA-NIAGARA-UAT&amp;t=uat-not-a-production-token&amp;view=contact">Связаться</a><a class="btn" href="?a=XA-NIAGARA-UAT&amp;t=uat-not-a-production-token&amp;view=edit">Редактировать результат</a><a
