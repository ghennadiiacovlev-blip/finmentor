<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08111F" />
  <meta name="robots" content="noindex,nofollow" />
  <title>FINMENTOR — Бриф для консультанта</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!--
    FINMENTOR Premium Mini App — CANDIDATE (b3.1.0).

    Built to docs/PREMIUM_UX_FINAL_RU_SPEC.md and the approved Fable visual contract. This is a
    CANDIDATE beside the deployed B.2.0 prototype in ../app/, which is left untouched: that
    directory is served from the site root, so editing it in place would change a live page.

    Every string comes from n8n/src/premium-ux/branches.js via content.js, so the copy cannot
    drift from the gated contract.

    ENDPOINTS ARE INJECTED AT DEPLOY TIME. FM_ENDPOINTS below holds placeholders; while they are
    placeholders the app is offline and says so, rather than pretending a submission succeeded.
    Nothing here may be committed with a real URL in it.
  -->
  <script>
    window.FM_ENDPOINTS = {
      gateway: '__PREMIUM_GATEWAY_URL__',
      session: '__PREMIUM_SESSION_URL__',
      submit:  '__PREMIUM_SUBMIT_URL__'
    };
  </script>
  <div class="shell">
    <header class="topbar">
      <button class="back" id="back" type="button" aria-label="Назад" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="brand">fin<i>mentor</i></div>
      <div class="topbar-spacer"></div>
    </header>

    <nav class="stages" id="stages" aria-label="Этапы"></nav>

    <main class="main" id="main" aria-live="polite"></main>

    <footer class="foot"><span>FINMENTOR</span><span>Confidential brief</span></footer>
  </div>

  <script src="content.js"></script>
  <script src="net.js"></script>
  <script src="app.js"></script>
</body>
</html>
